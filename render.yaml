# Render Blueprint: Cloud Deck
#
# Deploys the app as two services so it can run on Render Static hosting:
#   1. cloud-deck-web   (static)   - Next.js static export served from ./out
#   2. cloud-deck-socket (node)    - Socket.IO realtime server
#
# After the first deploy:
#   - Set NEXT_PUBLIC_SOCKET_URL on cloud-deck-web to cloud-deck-socket's URL (e.g. https://cloud-deck-socket.onrender.com)
#   - Set CORS_ORIGIN on cloud-deck-socket to the static site's URL (e.g. https://cloud-deck-web.onrender.com)
#   - Trigger a manual deploy of cloud-deck-web once (NEXT_PUBLIC_* vars are baked in at build time)

services:
  # Static frontend (Next.js static export)
  - type: web
    name: cloud-deck-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
    routes:
      # Backwards compatibility for previously shared /room/:id and /join/:id links
      - type: rewrite
        source: /room/:id
        destination: /room/?id=:id
      - type: rewrite
        source: /join/:id
        destination: /join/?id=:id

  # Socket.IO realtime backend
  - type: web
    name: cloud-deck-socket
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
